<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#132d28">
<title>Tịnh Xá Hương Thiền</title>
<style>
:root{--gold:#e8c77b;--ink:#132d28;--cream:#fff7e5}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9ac6b7;font-family:system-ui,-apple-system,sans-serif}
#scene{position:fixed;inset:0}canvas{display:block}
.top{position:fixed;top:env(safe-area-inset-top,10px);left:0;right:0;text-align:center;padding:12px 10px;pointer-events:none;color:#fff8e8;text-shadow:0 2px 8px #17352c}
h1{font-size:clamp(20px,5vw,30px);letter-spacing:2px;margin:0;font-weight:800}.sub{font-size:11px;letter-spacing:2px;margin-top:3px}
.panel{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.action{border:1px solid #f3dca5;background:rgba(19,45,40,.88);color:#fff8e8;border-radius:15px;padding:11px 5px;font-size:12px;font-weight:650;box-shadow:0 4px 16px #18352c55;backdrop-filter:blur(8px)}
.action span{display:block;font-size:21px;margin-bottom:3px}
#message{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);width:min(90%,420px);padding:13px 16px;border-radius:14px;background:rgba(255,248,229,.95);color:#29433a;text-align:center;box-shadow:0 5px 20px #18352c44;display:none;font-size:14px;line-height:1.5}
#hint{position:fixed;top:86px;left:50%;transform:translateX(-50%);white-space:nowrap;color:#fff9e9;background:#18372e88;border-radius:30px;padding:7px 12px;font-size:11px}
#close{display:none;position:fixed;right:20px;top:100px;border:0;border-radius:50%;width:34px;height:34px;background:#18372e;color:white;font-size:18px}
#timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:22px}
@media(min-width:700px){.panel{max-width:650px;left:50%;transform:translateX(-50%);grid-template-columns:repeat(6,1fr)}}
</style>
</head>
<body>
<div id="scene"></div>
<header class="top"><h1>TỊNH XÁ HƯƠNG THIỀN</h1><div class="sub">AN TRÚ THÂN TÂM · NUÔI DƯỠNG TỪ BI</div></header>
<div id="hint">Chạm và kéo để xoay cảnh · Cuộn để phóng to</div>
<div id="message"></div><button id="close" aria-label="Đóng">×</button>
<nav class="panel">
<button class="action" data-action="le"><span>🙏</span>Lễ Phật</button>
<button class="action" data-action="kinh"><span>📖</span>Tụng kinh</button>
<button class="action" data-action="niem"><span>📿</span>Niệm Phật</button>
<button class="action" data-action="thien"><span>🧘</span>Ngồi thiền</button>
<button class="action" data-action="chuong"><span>🔔</span>Thỉnh chuông</button>
<button class="action" data-action="hoasen"><span>🪷</span>Hồ sen</button>
</nav>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const root=document.querySelector('#scene');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9fc9bc);scene.fog=new THREE.Fog(0x9fc9bc,24,65);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,150);camera.position.set(10,8,15);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe8fff4,0x60765b,2));
const sun=new THREE.DirectionalLight(0xffe4ad,2.4);sun.position.set(-8,15,9);sun.castShadow=true;scene.add(sun);
const mat=(color,roughness=.85)=>new THREE.MeshStandardMaterial({color,roughness});
const green=mat(0x527d58),darkGreen=mat(0x315d48),wood=mat(0x8a5635),roof=mat(0x8d3d32),gold=mat(0xd9b45f),stone=mat(0xb9b7a8),water= new THREE.MeshStandardMaterial({color:0x58aeb0,roughness:.25,metalness:.12});
function box(w,h,d,m,x,y,z){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}
function cone(r1,r2,h,m,x,y,z,seg=4){let o=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,seg),m);o.position.set(x,y,z);o.castShadow=true;scene.add(o);return o}
const ground=new THREE.Mesh(new THREE.PlaneGeometry(100,100),mat(0x72966c));ground.rotation.x=-Math.PI/2;ground.position.y=-.12;ground.receiveShadow=true;scene.add(ground);
// Stone courtyard
box(17,.22,13,stone,0,0,0);
// Main hall
box(7,.35,5,wood,0,1.05,-2.5);box(7,.35,5,mat(0x6e4934),0,.55,-2.5);
for(let x of [-3,-1.5,0,1.5,3])for(let z of [-4.5,-.5]){let p=new THREE.Mesh(new THREE.CylinderGeometry(.13,.16,2.5,12),wood);p.position.set(x,1.8,z);p.castShadow=true;scene.add(p)}
box(7.8,.22,5.8,roof,0,3.05,-2.5);
let roofTop=new THREE.Mesh(new THREE.ConeGeometry(5.2,1.7,4),roof);roofTop.rotation.y=Math.PI/4;roofTop.scale.set(1,.65,.75);roofTop.position.set(0,3.85,-2.5);roofTop.castShadow=true;scene.add(roofTop);
box(2.3,1.7,.16,mat(0x49382e),0,1.65,-.02);
for(let x of [-2.8,2.8]){cone(.0,.35,.7,gold,x,4.8,-2.5,4)}
// Buddha-inspired golden seated silhouette, deliberately simple
const buddha=mat(0xe7c46b,.5);let body=new THREE.Mesh(new THREE.SphereGeometry(.62,24,18),buddha);body.scale.set(1.1,.85,.75);body.position.set(0,1.55,-3.2);scene.add(body);
let head=new THREE.Mesh(new THREE.SphereGeometry(.36,24,18),buddha);head.position.set(0,2.25,-3.2);scene.add(head);
let halo=new THREE.Mesh(new THREE.TorusGeometry(.58,.055,10,48),gold);halo.position.set(0,2.25,-3.32);scene.add(halo);
// Steps
for(let i=0;i<3;i++)box(3.8-i*.4,.18,.55,stone,0,.15+i*.18,.35+i*.42);
// Lotus pond at right
const pond=new THREE.Mesh(new THREE.CylinderGeometry(4.2,4.2,.22,64),water);pond.scale.z=.68;pond.position.set(8,.02,-1);scene.add(pond);
const rim=new THREE.Mesh(new THREE.TorusGeometry(4.1,.16,12,64),stone);rim.rotation.x=Math.PI/2;rim.scale.z=.68;rim.position.set(8,.13,-1);scene.add(rim);
const pink=mat(0xf2a8bd),leaf=mat(0x317b54);
for(let i=0;i<9;i++){let a=i*2.4,r=1.1+(i%3)*.85,x=8+Math.cos(a)*r,z=-1+Math.sin(a)*r*.65;
let l=new THREE.Mesh(new THREE.CircleGeometry(.48,24),leaf);l.rotation.x=-Math.PI/2;l.position.set(x,.16,z);scene.add(l);
let f=new THREE.Mesh(new THREE.SphereGeometry(.22,12,8),pink);f.scale.set(1,.35,1);f.position.set(x,.34,z);scene.add(f)}
// trees
function tree(x,z,s=1){let trunk=new THREE.Mesh(new THREE.CylinderGeometry(.16*s,.24*s,2.1*s,9),wood);trunk.position.set(x,1.05*s,z);scene.add(trunk);for(let j=0;j<3;j++){let crown=new THREE.Mesh(new THREE.IcosahedronGeometry((1.05-j*.13)*s,1),j%2?green:darkGreen);crown.position.set(x+(j-1)*.22*s,2.25*s+j*.48*s,z);crown.castShadow=true;scene.add(crown)}}
tree(-7,-5,1.2);tree(-8,3,1.1);tree(5,-8,1.2);tree(12,4,1.15);tree(-4,7,.9);
// Lanterns
for(let x of [-2.8,2.8]){let lamp=new THREE.Mesh(new THREE.SphereGeometry(.22,16,12),gold);lamp.scale.y=1.3;lamp.position.set(x,2.5,-.2);scene.add(lamp)}
// Avatar marker in courtyard
const avatar=new THREE.Group();let robe=new THREE.Mesh(new THREE.CapsuleGeometry(.32,.8,5,12),mat(0xd7b35f));robe.position.y=.75;avatar.add(robe);let face=new THREE.Mesh(new THREE.SphereGeometry(.23,16,12),mat(0xe8c7a4));face.position.y=1.35;avatar.add(face);avatar.position.set(0,0,3.3);scene.add(avatar);
// Camera orbit controls, touch + mouse
let dragging=false,px=0,py=0,theta=.62,phi=1.12,radius=19;
function updateCam(){phi=Math.max(.35,Math.min(1.42,phi));camera.position.set(Math.sin(theta)*Math.sin(phi)*radius,Math.cos(phi)*radius*.75,Math.cos(theta)*Math.sin(phi)*radius);camera.lookAt(1,1,-.5)}
updateCam();
renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;px=e.clientX;py=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});
renderer.domElement.addEventListener('pointermove',e=>{if(!dragging)return;theta-=(e.clientX-px)*.008;phi+=(e.clientY-py)*.006;px=e.clientX;py=e.clientY;updateCam()});
renderer.domElement.addEventListener('pointerup',()=>dragging=false);
renderer.domElement.addEventListener('wheel',e=>{radius=Math.max(10,Math.min(30,radius+e.deltaY*.015));updateCam()},{passive:true});
let msg=document.querySelector('#message'),close=document.querySelector('#close'),timerId=null;
function show(html){msg.innerHTML=html;msg.style.display='block';close.style.display='block'}
function hide(){msg.style.display='none';close.style.display='none';if(timerId){clearInterval(timerId);timerId=null}}
close.onclick=hide;
function bell(){try{let ctx=new (window.AudioContext||window.webkitAudioContext)(),o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(660,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(330,ctx.currentTime+2.2);g.gain.setValueAtTime(.22,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+3);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+3)}catch(e){}}
document.querySelectorAll('.action').forEach(b=>b.onclick=()=>{
hide();let a=b.dataset.action;
if(a==='le')show('<b>🙏 LỄ PHẬT</b><br>Thành kính chắp tay, hướng tâm về Tam Bảo.<br><br><i>Nguyện đem công đức này<br>Hướng về khắp tất cả...</i>');
if(a==='kinh')show('<b>📖 TỤNG KINH</b><br>Chọn một thời kinh để bắt đầu:<br><br>• Kinh Từ Bi<br>• Kinh Phước Đức<br>• Kinh A Di Đà<br><br><small>Bản thử nghiệm: phần văn bản kinh sẽ được bổ sung ở phiên bản tiếp theo.</small>');
if(a==='niem')show('<b>📿 NIỆM PHẬT</b><br><div style="font-size:20px;margin:12px 0;color:#986d2b">Nam Mô A Di Đà Phật</div><small>Thở vào nhẹ nhàng, thở ra niệm Phật. Giữ tâm an tịnh.</small>');
if(a==='thien'){let sec=300;show('<b>🧘 THIỀN ĐỊNH 5 PHÚT</b><br>Thân ngay thẳng, tâm buông thư.<br><div id="timer">05:00</div><small>Nhẹ nhàng biết rõ hơi thở vào và hơi thở ra.</small>');timerId=setInterval(()=>{sec--;let el=document.querySelector('#timer');if(!el)return;el.textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');if(sec<=0){clearInterval(timerId);timerId=null;el.textContent='Viên mãn';bell()}},1000)}
if(a==='chuong'){bell();show('<b>🔔 THỈNH CHUÔNG</b><br>Nguyện tiếng chuông tỉnh thức<br>Đưa người về bến an nhiên.')}
if(a==='hoasen'){theta=1.35;radius=13;updateCam();show('<b>🪷 HỒ SEN AN LẠC</b><br>Dừng chân bên hồ sen, lắng nghe gió nhẹ và trở về với phút giây hiện tại.')}
});
function animate(){requestAnimationFrame(animate);let t=performance.now()*.001;pond.position.y=.02+Math.sin(t)*.025;renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body></html>
